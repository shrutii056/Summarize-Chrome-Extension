<!DOCTYPE html>
<html lang="en">
<head>
    <title>Summarize Assistant</title>
    <link rel="stylesheet" href="sidePanel.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Summarize Assistant</h2>
        </div>
    <div class="action">
        <button id="summarizeBtn">Summarize</button>
    </div>
    <div class="notes">
        <h3>Summarize Notes</h3>
        <textarea  id="notes" placeholder="Take notes here"></textarea>
        <button id="saveNotesBtn">Save Notes</button>
    </div>
    <div id="results"></div>
    </div>
    <script src="sidepanel.js"></script>
</body>
</html>
